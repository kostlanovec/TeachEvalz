syntax = "proto3";

option csharp_namespace = "ClientApp";

import "Protos/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/Timestamp.proto";

package identity;

//Identity related services
service Identity {
  //Login user
  rpc Login (LoginRequest) returns (LoginResponse);
  
  //Refresh access token after expiration. 
  rpc RefreshAccessToken(RefreshAccessTokenRequest) returns (LoginResponse);

  //Who am I?
  rpc Me(google.protobuf.Empty) returns (Person);

  //Register person with password
  rpc Register(RegisterPersonRequest) returns (RegisterPersonResponse);

  //During filling registastration form, forntend might validate filled data
  rpc ValidateRegisterPersonData(RegisterPersonRequest) returns (Failure);

}

message Person {
    int64 personId = 1;

    google.protobuf.Timestamp created_at = 2;
    optional google.protobuf.Timestamp deleted_at = 3;

    string first_name = 4;
    string last_name  = 5;
    string email  = 6;

}



message LoginRequest {
  
    string email = 1;
    string password = 2;

}

message LoginResponse {
        string access_token = 1;
        string refresh_token  = 2;
        Failure failure = 3; // Operation failure.

}


message RefreshAccessTokenRequest {
  
        string refresh_token  = 2;

}

message RegisterPersonRequest {
  
        string nickname = 1;
        int32 primary_language_id = 2;
        string first_name  = 3;
        string last_name  = 4;
        string password  = 5;
        string primary_email = 6;

}

message RegisterPersonResponse {
        string access_token = 1;
        string refresh_token  = 2;
        int64 person_id = 3;

        Failure failure = 4; // Operation failure.
}
